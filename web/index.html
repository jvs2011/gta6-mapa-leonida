<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Mapa Leonida</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Leonida">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="img/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preload" href="fonts/roboto-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="map"></div>

<!-- Busca + chips (como no Google Maps) -->
<header class="top">
  <div class="searchbar">
    <span class="sb-logo" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7z" fill="#ea4335"/><circle cx="12" cy="9" r="2.6" fill="#b31412"/></svg>
    </span>
    <input id="q" type="search" placeholder="Pesquise em Leonida" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search">
    <button id="qClear" class="sb-btn" type="button" aria-label="Limpar" hidden>
      <svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
    <button id="btnMe" class="avatar" type="button" aria-label="Seu progresso">
      <svg viewBox="0 0 36 36" class="ring"><circle cx="18" cy="18" r="16" class="ring-bg"/><circle cx="18" cy="18" r="16" class="ring-fg" id="ringFg"/></svg>
      <span id="meTxt">0%</span>
    </button>
  </div>
  <div class="chips" id="chips"></div>
</header>
<div id="results" class="results" hidden></div>

<button id="btnLayers" class="fab fab-sm" type="button" aria-label="Camadas">
  <svg viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5 9-5z"/><path d="m3 13 9 5 9-5"/></svg>
</button>
<button id="btnHome" class="fab" type="button" aria-label="Ver Leonida inteira">
  <svg viewBox="0 0 24 24" class="nav"><path d="M12 2 4.5 20.3l.7.7L12 18l6.8 3 .7-.7z"/></svg>
</button>

<div id="scale" class="scale" aria-hidden="true"><span id="scaleTxt"></span><i id="scaleBar"></i></div>
<div id="toast" class="toast" hidden></div>

<!-- Ficha do lugar -->
<section id="sheet" class="sheet" aria-hidden="true">
  <div class="grab"></div>
  <div id="sheetBody"></div>
</section>

<!-- Camadas -->
<section id="layers" class="sheet" aria-hidden="true">
  <div class="grab"></div>
  <div id="layersBody"></div>
</section>

<!-- Você: progresso, categorias, ajustes -->
<section id="panel" class="panel" aria-hidden="true">
  <header class="panel-head">
    <button id="panelClose" class="icon-btn" type="button" aria-label="Fechar">
      <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <h2>Seu progresso</h2>
  </header>
  <div class="panel-tabs">
    <button type="button" data-tab="cats" class="on">Categorias</button>
    <button type="button" data-tab="more">Ajustes</button>
  </div>
  <div id="tabCats" class="panel-body"></div>
  <div id="tabMore" class="panel-body" hidden></div>
</section>

<div id="viewer" class="viewer" hidden><img alt=""></div>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
